name: Build and Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Check types, build, and package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Check types
        run: npm run check-types

      - name: Build extension
        run: npm run build

      - name: Run tests
        run: xvfb-run -a npm test

      - name: Package VSIX
        run: npm run package -- --out vscode-simple-image-gallery.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: release-package-${{ github.run_id }}
          path: vscode-simple-image-gallery.vsix
          if-no-files-found: error

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download VSIX package
        uses: actions/download-artifact@v8
        with:
          name: release-package-${{ github.run_id }}
          path: release

      - name: Locate VSIX package
        id: locate-vsix
        run: |
          vsix="$(find release -maxdepth 1 -name '*.vsix' -print -quit)"
          test -n "$vsix"
          echo "path=$vsix" >> "$GITHUB_OUTPUT"

      - name: Create published release with generated notes and VSIX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" '${{ steps.locate-vsix.outputs.path }}' \
            --repo "$GITHUB_REPOSITORY" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

      - name: Publish to VS Marketplace
        run: npx @vscode/vsce publish --packagePath '${{ steps.locate-vsix.outputs.path }}'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        run: npx ovsx publish '${{ steps.locate-vsix.outputs.path }}' -p ${{ secrets.OVSX_PAT }}
